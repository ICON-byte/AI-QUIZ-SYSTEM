name: Checks
on:
  push:
  pull_request:

jobs:
  stage-one:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: quiz_test
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: ai_quiz_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quiz_test -d ai_quiz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://quiz_test:ci-disposable-password@127.0.0.1:5432/ai_quiz_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
